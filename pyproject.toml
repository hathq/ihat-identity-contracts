[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ihat-identity-contracts"
version = "0.1.0"
description = "Closed, versioned iHAT identity boundary contracts"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.10,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ihat]
boundary = "identity-contracts"
external_actions = false
credentials = false
